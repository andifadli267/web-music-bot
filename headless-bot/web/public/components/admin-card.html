<!-- Room Administration Card -->
<section class="card admin-card">
    <div class="card-header">
        <div class="header-tag">
            <span>🔒</span>
            <span>ROOM ADMINISTRATION</span>
        </div>
        <span class="badge badge-admin">Room Admin</span>
    </div>

    <!-- Admin Tabs -->
    <div class="admin-tabs">
        <button class="tab-btn active" data-tab="tab-admins">👑 Admin</button>
        <button class="tab-btn" data-tab="tab-whitelist">📜 Whitelist</button>
        <button class="tab-btn" data-tab="tab-ban">🚫 Banlist</button>
        <button class="tab-btn" data-tab="tab-kick">👢 Kick</button>
    </div>

    <div class="admin-tab-content">
        <!-- Tab: Admins -->
        <div id="tab-admins" class="tab-pane active">
            <form id="form-add-admin" class="admin-inline-form">
                <input type="number" id="input-add-admin-id" placeholder="Member Number (e.g. 245253)" required>
                <button type="submit" class="btn btn-sm btn-primary">+ Add Admin</button>
            </form>
            <div class="admin-list-container">
                <h5>Room Administrators List:</h5>
                <div id="room-admins-list" class="badge-list">
                    <span class="empty-hint">No admin data found.</span>
                </div>
            </div>
        </div>

        <!-- Tab: Whitelist -->
        <div id="tab-whitelist" class="tab-pane">
            <form id="form-add-wl" class="admin-inline-form">
                <input type="number" id="input-add-wl-id" placeholder="Member Number (e.g. 254143)" required>
                <button type="submit" class="btn btn-sm btn-accent">+ Add to Whitelist</button>
            </form>
            <div class="admin-list-container">
                <h5>Whitelist Members:</h5>
                <div id="room-whitelist-list" class="badge-list">
                    <span class="empty-hint">Whitelist is empty (public access open).</span>
                </div>
            </div>
        </div>

        <!-- Tab: Banlist -->
        <div id="tab-ban" class="tab-pane">
            <form id="form-add-ban" class="admin-inline-form">
                <input type="number" id="input-add-ban-id" placeholder="Member Number (e.g. 12345)" required>
                <button type="submit" class="btn btn-sm btn-danger">+ Ban Member</button>
            </form>
            <div class="admin-list-container">
                <h5>Banned Members List:</h5>
                <div id="room-ban-list" class="badge-list">
                    <span class="empty-hint">No banned members.</span>
                </div>
            </div>
        </div>

        <!-- Tab: Kick -->
        <div id="tab-kick" class="tab-pane">
            <form id="form-kick" class="admin-inline-form">
                <input type="number" id="input-kick-id" placeholder="Member Number to kick..." required>
                <button type="submit" class="btn btn-sm btn-danger">👢 Kick from Room</button>
            </form>
            <p class="admin-note">⚠️ Kicked players will be immediately removed from the room.</p>
        </div>
    </div>
</section>
