<!-- Upcoming Queue Card -->
<section class="card queue-card">
    <div class="card-header">
        <div class="header-tag">
            <span>📋</span>
            <span data-i18n="queue_tag">UPCOMING QUEUE</span>
        </div>
        <span id="queue-counter" class="badge badge-counter">0 / 20</span>
    </div>

    <!-- Queue List Container -->
    <div id="queue-list" class="queue-list">
        <div class="queue-empty">
            <div class="empty-icon">☕</div>
            <h3 data-i18n="queue_empty_title">Queue is Empty</h3>
            <p data-i18n="queue_empty_desc">Use the player form or type !play title in room chat to queue a song.</p>
        </div>
    </div>
</section>
