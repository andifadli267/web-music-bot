<!-- Music Control Panel Card -->
<section class="card control-card">
    <div class="card-header">
        <div class="header-tag">
            <span>🎛️</span>
            <span data-i18n="music_controls_tag">MUSIC PLAYER CONTROLS</span>
        </div>
        <span class="badge badge-accent" data-i18n="remote_control_badge">Remote Control</span>
    </div>

    <div class="control-body">
        <!-- Request Song Form -->
        <form id="form-play" class="play-form">
            <div class="form-row">
                <div class="input-group flex-2">
                    <label for="input-query" data-i18n="label_song_query">Song Title or URL (YouTube / .mp3 / .mp4):</label>
                    <div class="input-with-icon">
                        <span class="input-icon">🔍</span>
                        <input type="text" id="input-query" placeholder="e.g. Linkin Park Numb or YouTube link..." data-i18n-placeholder="placeholder_song_query" required autocomplete="off">
                    </div>
                </div>
                <div class="input-group flex-1">
                    <label for="input-requester" data-i18n="label_requester">Requester Name:</label>
                    <div class="input-with-icon">
                        <span class="input-icon">👤</span>
                        <input type="text" id="input-requester" placeholder="Your Name (Web DJ)" data-i18n-placeholder="placeholder_requester" value="Web DJ">
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" id="btn-submit-play" class="btn btn-primary">
                    <span>▶️</span> <span data-i18n="btn_play_track">Play / Queue Track</span>
                </button>
            </div>
        </form>

        <!-- Quick Music Action Buttons -->
        <div class="quick-actions-bar">
            <button id="btn-action-skip" class="btn btn-secondary">
                <span>⏭️</span> <span data-i18n="btn_skip_track">Skip Track</span>
            </button>
            <button id="btn-action-stop" class="btn btn-danger">
                <span>⏹️</span> <span data-i18n="btn_stop_music">Stop Music</span>
            </button>
            <button id="btn-action-clear" class="btn btn-warning">
                <span>🗑️</span> <span data-i18n="btn_clear_queue">Clear Queue</span>
            </button>
        </div>

        <!-- 24/7 Radio Station Quick Buttons -->
        <div class="radio-section">
            <div class="radio-label">
                <span>📻</span> <strong data-i18n="radio_stations_label">24/7 Radio Stations:</strong> <span data-i18n="radio_stations_sub">(Click to play instantly)</span>
            </div>
            <div class="radio-grid" id="radio-grid">
                <button class="btn-radio" data-genre="lofi">☕ Lofi Hip-Hop</button>
                <button class="btn-radio" data-genre="synth">🌆 Synthwave</button>
                <button class="btn-radio" data-genre="chillsynth">🌙 Chillwave</button>
                <button class="btn-radio" data-genre="pop">✨ Pop Hits</button>
                <button class="btn-radio" data-genre="dance">⚡ Dance / EDM</button>
                <button class="btn-radio" data-genre="rock">🎸 Classic Rock</button>
                <button class="btn-radio" data-genre="hiphop">🎤 Hip-Hop</button>
                <button class="btn-radio" data-genre="jazz">🎷 Smooth Jazz</button>
            </div>
        </div>
    </div>
</section>
