<!-- Room Status & Members Card -->
<section class="card room-card">
    <div class="card-header">
        <div class="header-tag">
            <span>📍</span>
            <span data-i18n="room_status_tag">ROOM STATUS & MEMBERS</span>
        </div>
        <span id="member-count-badge" class="badge badge-counter">0 Players</span>
    </div>

    <div class="room-details-grid">
        <div class="room-meta-item">
            <span class="meta-label" data-i18n="label_room_name">Room Name</span>
            <strong id="meta-room-name" class="meta-value">-</strong>
        </div>
        <div class="room-meta-item">
            <span class="meta-label" data-i18n="label_bot_char">Bot Character</span>
            <strong id="meta-bot-name" class="meta-value">Nava (#258115)</strong>
        </div>
        <div class="room-meta-item">
            <span class="meta-label" data-i18n="label_friends_count">Friends Count</span>
            <strong id="meta-friends-count" class="meta-value">-</strong>
        </div>
    </div>

    <div class="players-section">
        <h4 class="section-title" data-i18n="players_in_room_title">Players in Room:</h4>
        <div id="players-list" class="players-tags">
            <span class="player-tag empty-tag" data-i18n="players_empty_hint">Loading player list...</span>
        </div>
    </div>
</section>
