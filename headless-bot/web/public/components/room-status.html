<!-- Room Status & Members Card -->
<section class="card room-card">
    <div class="card-header">
        <div class="header-tag">
            <span>📍</span>
            <span>ROOM STATUS & MEMBERS</span>
        </div>
        <span id="member-count-badge" class="badge badge-counter">0 Pemain</span>
    </div>

    <div class="room-details-grid">
        <div class="room-meta-item">
            <span class="meta-label">Nama Ruangan</span>
            <strong id="meta-room-name" class="meta-value">-</strong>
        </div>
        <div class="room-meta-item">
            <span class="meta-label">Bot Character</span>
            <strong id="meta-bot-name" class="meta-value">Nava (#258115)</strong>
        </div>
        <div class="room-meta-item">
            <span class="meta-label">Total Teman</span>
            <strong id="meta-friends-count" class="meta-value">-</strong>
        </div>
    </div>

    <div class="players-section">
        <h4 class="section-title">Pemain di Dalam Ruangan:</h4>
        <div id="players-list" class="players-tags">
            <span class="player-tag empty-tag">Sedang memuat data pemain...</span>
        </div>
    </div>
</section>
