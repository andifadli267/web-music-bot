<!-- Bot Offline Modal / Overlay (Visible when bot is offline or not in room) -->
<div id="bot-offline-overlay" class="offline-overlay hidden">
    <div class="offline-modal">
        <div class="offline-icon">🔌</div>
        <h2 class="offline-title" data-i18n="offline_modal_title">Bot Offline / Inactive</h2>
        <p class="offline-desc" data-i18n="offline_modal_desc">The dashboard and remote controls are active only when bot Nava is online and inside a game room.</p>
        <div class="offline-status-details">
            <div class="offline-step">
                <span class="step-label" data-i18n="offline_step_web">🌐 Web Server:</span>
                <strong class="step-val text-success" data-i18n="offline_val_server_on">Online (Port 3000)</strong>
            </div>
            <div class="offline-step">
                <span class="step-label" data-i18n="offline_step_bot">🤖 Bot Status:</span>
                <strong id="overlay-bot-status" class="step-val text-danger">Disconnected</strong>
            </div>
            <div class="offline-step">
                <span class="step-label" data-i18n="offline_step_room">🚪 Room Status:</span>
                <strong id="overlay-room-status" class="step-val text-warning">Outside Room</strong>
            </div>
        </div>
        <div class="offline-pulse">
            <span class="pulse-spinner"></span>
            <span data-i18n="offline_reconnecting">Attempting automatic reconnection...</span>
        </div>
    </div>
</div>
